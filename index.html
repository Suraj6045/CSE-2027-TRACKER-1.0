const T13=W("DL C DBMS Algo DM TOC DS CD CN COA EM GA OS");[...T13,...T13].forEach((s,i)=>ad("GF","Topic Tests (TT)",s,"TT "+(i+1)+" · "+s,"Topic",i<6?"17 May":i<13?"24 May":i<19?"31 May":"7 Jun"));

const day=()=>Math.floor(Date.now()/864e5),pct=(a,b)=>b?Math.round(a/b*100):0,msg=t=>{const e=$("#lm");if(e)e.textContent=t};
const api=async(m,u,b)=>{const r=await fetch("/api/"+u,{method:m,headers:b?{"Content-Type":"application/json"}:{},body:b?JSON.stringify(b):undefined,credentials:"same-origin"});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||("Error "+r.status)),{status:r.status});return j};
let pend=0;
const save=()=>{pend=1;clearTimeout(tm);tm=setTimeout(flush,800)};

({list:vList,rev:vRev,an:vAn,add:vAdd,gr:vGr})[V]()}

$("#app").innerHTML=fl()+Object.keys(gs).map(k=>{const ix=gs[k],dn=ix.filter(i=>P[i.k]&&P[i.k].c).length,[se,g]=k.split("|");return`<details ${(window.OP||{})[k]?"open":""} data-k="${esc(k)}"><summary><span>${esc(g)} <small>${SER[se]}</small></span><small>${dn}/${ix.length}</small></summary><div class=bar><i style="width:${pct(dn,ix.length)}%"></i></div>${ix.map(row).join("")}</details>`}).join("")}
function vRev(){const L2=all().filter(i=>P[i.k]&&P[i.k].q&&(F=="ALL"||i.se==F));$("#app").innerHTML=fl()+`<div class=card><h2>Questions to revisit <small class=mu>(${L2.reduce((a,i)=>a+P[i.k].q.split(",").length,0)} total)</small></h2>${L2.map(i=>`<div class=r><span style="flex:1"><b>${esc(i.name)}</b> <small class=mu>${SER[i.se]}</small></span>${P[i.k].q.split(",").map(q=>`<span class=tg>Q${esc(q)}</span>`).join("")}<button class=x data-rq="${i.k}" title="Done revising">✔</button></div>`).join("")||'<p class=mu>Nothing to revisit. Add question numbers in the checklist rows.</p>'}</div>`}
function vAdd(){$("#app").innerHTML=`<div class=card><h2>Add your own test / quiz</h2><div class=f><select id=a1>${Object.entries(SER).map(s=>`<option value=${s[0]}>${s[1]}</option>`)}</select><input id=a2 placeholder="Group"><input id=a3 placeholder="Test / quiz name"><select id=a4><option>Topic</option><option>Subject</option><option>Full</option><option>Quiz</option><option>Mixed</option></select><input id=a6 placeholder="Subject tag (DM, OS…)"></div><p><button class=btn data-a=addt>Add to checklist</button></p></div><div class=card><h2>Exam date</h2><input type=date id=ex value="${EXAM}"></div>`}
function vGr(){const G=JSON.parse(ls("cse_g_"+U.id)||"[]");$("#app").innerHTML=`<div class=card><h2>Upload score / analysis graphs</h2><div class=f><input id=cap placeholder="Caption"><input type=file id=fl accept="image/*" multiple></div><p class=mu>Stored on this device only (keeps the database small).</p></div><div class=gal>${G.map((m,i)=>`<div class=card style="padding:8px"><img src="${m.src}" data-z=${i}><div style="font-size:12px;margin-top:6px">${esc(m.cap)} <button class=x data-di=${i}>✕</button></div></div>`).join("")||'<p class=mu>No graphs yet.</p>'}</div>`}
function mk(t,cfg){const d=document.createElement("div");d.className="card";d.innerHTML=`<h2>${t}</h2><div class=cv><canvas></canvas></div>`;$("#app").lastChild.appendChild(d);CH.push(new Chart(d.querySelector("canvas"),cfg))}
function vAn(){const{A,d,sc}=stats(),C5=["#7c5cff","#22d3ee","#34d399","#fbbf24","#f472b6","#fb7185"];Chart.defaults.color=getComputedStyle(document.documentElement).getPropertyValue("--mu");Chart.defaults.maintainAspectRatio=false;
const sub={};A.forEach(i=>{const s=sub[i.subj]=sub[i.subj]||{t:0,d:0,p:[]};s.t++;if(P[i.k]&&P[i.k].c)s.d++});sc.forEach(x=>sub[x.i.subj].p.push(x.p));
const ks=Object.keys(sub),av=k=>sub[k].p.length?Math.round(sub[k].p.reduce((a,b)=>a+b,0)/sub[k].p.length):null,rem=A.length-d.length,wk=Math.max(.5,(new Date(EXAM)-Date.now())/6048e5),rk=ks.filter(k=>av(k)!=null).sort((a,b)=>av(a)-av(b)),lo=ks.filter(k=>sub[k].t>2).sort((a,b)=>sub[a].d/sub[a].t-sub[b].d/sub[b].t)[0],days=new Set(d.map(i=>P[i.k].t).filter(Boolean)).size,nq=A.reduce((a,i)=>a+(P[i.k]&&P[i.k].q?P[i.k].q.split(",").length:0),0);
let ins=`<li>~<b>${(rem/wk).toFixed(1)} tests/week</b> needed to finish ${rem} remaining before the exam.</li>`;if(lo)ins+=`<li>Least-covered subject: <b>${lo}</b> (${sub[lo].d}/${sub[lo].t}).</li>`;
ins+=rk.length?`<li>Weakest: <b>${rk.slice(0,3).map(k=>k+" "+av(k)+"%").join(", ")}</b>. Strongest: <b>${rk.slice(-2).reverse().map(k=>k+" "+av(k)+"%").join(", ")}</b>.</li>`:`<li>Enter score and max marks to unlock score analysis.</li>`;
if(sc.length>=4){const s=sc.slice().sort((a,b)=>a.t-b.t),h=s.length>>1,m=x=>x.reduce((a,b)=>a+b.p,0)/x.length;ins+=`<li>Trend: recent ${Math.round(m(s.slice(h)))}% vs earlier ${Math.round(m(s.slice(0,h)))}% – ${m(s.slice(h))>=m(s.slice(0,h))?"improving 📈":"dipping 📉"}</li>`}
ins+=`<li>Active on <b>${days}</b> day(s); <b>${nq}</b> questions queued for revisit.</li>`;
$("#app").innerHTML=`<div class=card><h2>Insights</h2><ul class=ins>${ins}</ul></div><div class=g2></div>`;
const se=Object.keys(SER);
mk("Progress by series",{type:"bar",data:{labels:se.map(k=>SER[k]),datasets:[{data:se.map(k=>{const a=A.filter(i=>i.se==k);return pct(a.filter(i=>P[i.k]&&P[i.k].c).length,a.length)}),backgroundColor:C5}]},options:{scales:{y:{max:100}},plugins:{legend:{display:false}}}});
mk("Completion by subject",{type:"bar",data:{labels:ks,datasets:[{label:"Done",data:ks.map(k=>sub[k].d),backgroundColor:C5[2]},{label:"Left",data:ks.map(k=>sub[k].t-sub[k].d),backgroundColor:"#8b95b355"}]},options:{scales:{x:{stacked:true},y:{stacked:true}}}});
const ts=sc.slice().sort((a,b)=>a.t-b.t);
mk("Score trend (%)",{type:"line",data:{labels:ts.map((x,i)=>i+1),datasets:[{label:"Score %",data:ts.map(x=>Math.round(x.p)),borderColor:C5[0],backgroundColor:"#7c5cff33",fill:true,tension:.3}]},options:{scales:{y:{max:100,min:0}}}});
mk("Average score by subject",{type:"radar",data:{labels:rk,datasets:[{label:"Avg %",data:rk.map(av),borderColor:C5[1],backgroundColor:"#22d3ee33"}]},options:{scales:{r:{max:100,min:0}}}});
const w=Array(8).fill(0);d.forEach(i=>{const t=P[i.k].t;if(t){const k=Math.floor((day()-t)/7);if(k<8)w[7-k]++}});
mk("Tests per week (last 8)",{type:"bar",data:{labels:w.map((_,i)=>i==7?"This wk":"-"+(7-i)+"w"),datasets:[{data:w,backgroundColor:C5[3]}]},options:{plugins:{legend:{display:false}}}})}
document.addEventListener("click",e=>{const t=e.target,g=a=>t.dataset[a];
if(g("v")){V=g("v");render()}else if(g("f")){F=g("f");render()}
else if(g("a")=="login"||g("a")=="reg")auth(g("a")=="reg");
else if(g("a")=="out"){e.preventDefault();flush();api("POST","logout").catch(()=>{}).then(()=>{U=null;ADMIN=false;P={};CUS=[];AN=[];ann();render()})}
else if(g("a")=="post"){const x=$("#at").value.trim();if(x)api("POST","announcements",{t:x}).then(refAnn).catch(er=>alert(er.message))}
else if(g("ad")){api("DELETE","announcements/"+g("ad")).then(refAnn).catch(()=>{})}
else if(g("rq")){set(g("rq"),d=>{delete d.q});render()}
else if(g("x")){if(confirm("Delete this custom test?")){CUS[+g("x").slice(1)]=0;delete P[g("x")];save();render()}}
else if(g("a")=="addt"){const n=$("#a3").value.trim();if(!n)return;CUS.push([$("#a1").value,$("#a2").value||"Custom",$("#a6").value||"Other",n,$("#a4").value]);save();V="list";render()}
else if(g("di")!=null){const G=JSON.parse(ls("cse_g_"+U.id)||"[]");G.splice(+g("di"),1);ls("cse_g_"+U.id,JSON.stringify(G));render()}
else if(g("z")!=null){const G=JSON.parse(ls("cse_g_"+U.id)||"[]"),o=document.createElement("div");o.className="ov";o.innerHTML=`<img src="${G[+g("z")].src}">`;o.onclick=()=>o.remove();document.body.appendChild(o)}});
document.addEventListener("toggle",e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){window.OP=window.OP||{};OP[k]=e.target.open}},true);
document.addEventListener("change",e=>{const t=e.target,D=t.dataset;
if(D.c){set(D.c,d=>{d.c=t.checked?1:0;if(t.checked)d.t=day()});render()}
else if(D.s){set(D.s,d=>{d.s=t.value===""?undefined:+t.value;if(d.s!=null&&!d.c){d.c=1;d.t=day()}});render()}
else if(D.m){set(D.m,d=>{d.m=+t.value||undefined});render()}
else if(D.q){set(D.q,d=>{d.q=t.value.replace(/[^0-9,]/g,"").replace(/,+/g,",").replace(/^,|,$/g,"")||undefined});render()}
else if(t.id=="ex"){EXAM=t.value;save();render()}
else if(t.id=="fl"){[...t.files].forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,700/im.width),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);const G=JSON.parse(ls("cse_g_"+U.id)||"[]");G.push({src:c.toDataURL("image/jpeg",.6),cap:$("#cap").value||f.name});ls("cse_g_"+U.id,JSON.stringify(G));render()};im.src=r.result};r.readAsDataURL(f)})}});
render();boot();
</script></body></html>
